<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" width="1200" height="400">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="100%" stop-color="#e0f2fe" />
    </linearGradient>

    <!-- Cyan Accent Gradient -->
    <linearGradient id="primaryGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0891b2" />
      <stop offset="100%" stop-color="#06b6d4" />
    </linearGradient>

    <!-- Warm Accent Gradient for "Parents" -->
    <linearGradient id="warmGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>

    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#0f172a" flood-opacity="0.06"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Base Background -->
  <rect width="1200" height="400" fill="url(#bgGrad)" />

  <!-- Abstract decorative background shapes -->
  <circle cx="100" cy="-50" r="300" fill="#0ea5e9" opacity="0.03" />
  <circle cx="1100" cy="450" r="400" fill="#0891b2" opacity="0.04" />
  
  <!-- Left Side: The "Document & Tech" (Children uploading) -->
  <g transform="translate(100, 80)">
    <!-- Document Base -->
    <rect x="0" y="20" width="180" height="240" rx="16" fill="#ffffff" filter="url(#softShadow)" />
    <!-- Document Lines -->
    <rect x="24" y="50" width="100" height="8" rx="4" fill="#cbd5e1" />
    <rect x="24" y="70" width="132" height="6" rx="3" fill="#e2e8f0" />
    <rect x="24" y="86" width="110" height="6" rx="3" fill="#e2e8f0" />
    <rect x="24" y="102" width="132" height="6" rx="3" fill="#e2e8f0" />
    <!-- Heartbeat Chart on Document -->
    <polyline points="24,150 40,150 50,130 60,170 70,150 156,150" fill="none" stroke="#0ea5e9" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <!-- AI Scan Beam overlay -->
    <rect x="0" y="110" width="180" height="60" fill="url(#primaryGrad)" opacity="0.1" />
    <line x1="-10" y1="140" x2="190" y2="140" stroke="#06b6d4" stroke-width="4" filter="url(#glow)" stroke-linecap="round"/>
    
    <text x="90" y="-10" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#64748b" text-anchor="middle" letter-spacing="1">1. UPLOAD REPORT</text>
  </g>

  <!-- Center: The "Transformation & AI" Engine -->
  <g transform="translate(380, 150)">
    <!-- Connection lines -->
    <path d="M-60 50 C -20 50, 20 50, 60 50" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,6" />
    
    <!-- AI Core Engine -->
    <circle cx="140" cy="50" r="48" fill="#ffffff" filter="url(#softShadow)"/>
    <!-- Central Icon (Brain/Sparkle abstract) -->
    <path d="M140 20 L145 40 L165 45 L145 50 L140 70 L135 50 L115 45 L135 40 Z" fill="url(#primaryGrad)" filter="url(#glow)"/>
    <circle cx="140" cy="50" r="16" fill="#cffafe" />
    <circle cx="140" cy="50" r="6" fill="#0891b2" />

    <text x="140" y="130" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#64748b" text-anchor="middle" letter-spacing="1">2. AI TRANSFORMS</text>
    
    <path d="M220 50 C 260 50, 300 50, 340 50" fill="none" stroke="#94a3b8" stroke-width="2" stroke-dasharray="6,6" />
  </g>

  <!-- Right Side: The "Video & Parents" (Relief and Clarity) -->
  <g transform="translate(800, 80)">
    <!-- Phone / Video Device -->
    <rect x="40" y="0" width="160" height="280" rx="24" fill="#ffffff" filter="url(#softShadow)" />
    <!-- Screen -->
    <rect x="50" y="10" width="140" height="260" rx="16" fill="#f8fafc" />
    <!-- Video Player Area -->
    <rect x="50" y="10" width="140" height="180" fill="url(#primaryGrad)" opacity="0.05" />
    
    <!-- Play Button -->
    <circle cx="120" cy="100" r="24" fill="#0891b2" filter="url(#glow)"/>
    <polygon points="112,88 112,112 134,100" fill="#ffffff" />

    <!-- Video UI lines -->
    <rect x="62" y="210" width="116" height="8" rx="4" fill="#e2e8f0" />
    <rect x="62" y="230" width="80" height="6" rx="3" fill="#e2e8f0" />
    <rect x="62" y="246" width="100" height="6" rx="3" fill="#e2e8f0" />

    <!-- A floating heart representing parental relief -->
    <g transform="translate(160, 20) rotate(15)">
      <path d="M12,21.35L10.55,20.03C5.4,15.36 2,12.27 2,8.5C2,5.41 4.42,3 7.5,3C9.24,3 10.91,3.81 12,5.08C13.09,3.81 14.76,3 16.5,3C19.58,3 22,5.41 22,8.5C22,12.27 18.6,15.36 13.45,20.03L12,21.35Z" fill="url(#warmGrad)" filter="url(#glow)" transform="scale(1.5)" />
    </g>

    <text x="120" y="-10" font-family="system-ui, -apple-system, sans-serif" font-weight="600" font-size="14" fill="#64748b" text-anchor="middle" letter-spacing="1">3. PARENTS UNDERSTAND</text>
  </g>

  <!-- Connecting the story: Main Title overlay at bottom center -->
  <g transform="translate(600, 340)">
    <text x="0" y="0" font-family="system-ui, -apple-system, sans-serif" font-weight="800" font-size="36" fill="#0f172a" text-anchor="middle" letter-spacing="-1">
      Translate complex medical reports into <tspan fill="#0891b2">clear video messages</tspan>
    </text>
    <text x="0" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="500" font-size="18" fill="#64748b" text-anchor="middle">
      Giving your parents peace of mind, instantly.
    </text>
  </g>

</svg>
